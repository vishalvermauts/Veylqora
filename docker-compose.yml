services:
  veylqora:
    build: .
    image: veylqora:0.2
    restart: unless-stopped
    # No ports are published: the daemon is loopback-only (ADR-0012). Reach it
    # with `docker compose exec veylqora ...`.
    volumes:
      - veylqora-data:/data
      # Read-only view of the project to index, at /workspace.
      - ${VEYLQORA_WORKSPACE:-./}:/workspace:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  veylqora-data:
